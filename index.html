<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Skybound Evolutions</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#101827;font-family:Georgia,'Times New Roman',serif;color:#fff}.game-wrap{position:relative;width:min(480px,94vw)}canvas{display:block;width:100%;aspect-ratio:3/4;border-radius:18px;background:#9bdcff;box-shadow:0 20px 60px #0008;touch-action:none;cursor:pointer}.hud{position:absolute;z-index:2;top:12px;left:0;right:0;display:flex;justify-content:space-between;align-items:flex-start;padding:0 16px;text-shadow:0 2px 4px #0009;pointer-events:none}.score{font:bold 32px Georgia}.stage-hud{text-align:right;font:bold 15px Georgia}.food{margin-top:4px;font:700 13px Georgia}.power-hud{margin-top:5px;color:#fde68a}.power-button{position:absolute;z-index:4;right:14px;bottom:18px;min-width:112px;min-height:48px;border:2px solid #fde68a;border-radius:14px;background:#172554dd;color:#fff;font:700 15px Georgia;box-shadow:0 4px 16px #0006;cursor:pointer}.power-button:active{transform:translateY(2px)}.overlay{position:absolute;z-index:3;inset:0;display:flex;align-items:center;justify-content:center;padding:24px}.overlay.victory{align-items:flex-start}.overlay.victory .panel{margin-top:8px}.panel{background:#ffffffed;color:#172033;border-radius:20px;padding:28px;text-align:center;max-width:340px;box-shadow:0 15px 45px #0005}.panel h1{margin:0 0 8px;font-size:30px}.panel p{margin:0 0 18px;color:#475569;line-height:1.45}.panel button{border:0;border-radius:12px;padding:13px 22px;font:700 16px Georgia;cursor:pointer;background:#2563eb;color:#fff}.hint{text-align:center;color:#94a3b8;font:13px Georgia;margin-top:10px}.hidden{display:none!important}
</style>
</head>
<body>
<div class="game-wrap">
<div class="hud"><div class="score" id="score">0</div><div class="stage-hud"><div id="stageLabel">🐦 BIRD · CITY</div><div class="food" id="foodLabel">FOOD 0 / 5</div><div class="power-hud" id="powerLabel">POWER: LOCKED</div></div></div>
<canvas id="game" width="480" height="640"></canvas><button class="power-button hidden" id="powerButton">⚡ POWER</button>
<div class="overlay" id="overlay"><div class="panel"><h1 id="title">🐦 Skybound Evolutions</h1><p id="message">Tap, click, or press Space to fly. E activates a charged power.</p><button id="start">Start Game</button></div></div>
</div><div class="hint">SPACE / CLICK / TAP = FLAP · E = POWER</div>
<script>
// CONFIGURATION: checkpoint, world, food, difficulty, and power live here.
const STAGES=[
 {name:'bird',label:'🐦 BIRD',world:'city',checkpoint:25,food:'🪰',foodName:'flies',foodNeeded:5,power:'dash',powerLabel:'⚡ DASH',speed:2.65,gap:174,spawn:94},
 {name:'eagle',label:'🦅 EAGLE',world:'forest',checkpoint:50,food:'🐍',foodName:'snakes',foodNeeded:5,power:'vision',powerLabel:'👁 VISION',speed:3.05,gap:164,spawn:91},
 {name:'dragon',label:'🐉 DRAGON',world:'mountains',checkpoint:75,food:'🐑',foodName:'sheep',foodNeeded:5,power:'fire',powerLabel:'🔥 FIRE',speed:3.4,gap:153,spawn:87},
 {name:'horse',label:'🦄 FLYING HORSE',world:'heaven',checkpoint:100,food:'✨',foodName:'stars',foodNeeded:5,power:'teleport',powerLabel:'🌀 TELEPORT',speed:3.75,gap:146,spawn:83}
];
const W=480,H=640,ground=570,pipeW=72,gravity=.42,flapVelocity=-7.1;
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d');
const scoreEl=document.getElementById('score'),stageEl=document.getElementById('stageLabel'),foodEl=document.getElementById('foodLabel'),powerEl=document.getElementById('powerLabel'),powerButton=document.getElementById('powerButton'),overlay=document.getElementById('overlay'),title=document.getElementById('title'),message=document.getElementById('message'),start=document.getElementById('start');
let player,obstacles,collectibles,particles,fireballs,score,stageIndex,foodCount,powerReady,powerTimer,frame,spawnTimer,foodTimer,shake,transitionTimer,state,anim,last=0;
function currentStage(){return STAGES[stageIndex]}
function reset(){player={x:105,y:300,vy:0,r:17,rot:0};obstacles=[];collectibles=[];particles=[];fireballs=[];score=0;stageIndex=0;foodCount=0;powerReady=false;powerTimer=0;frame=0;spawnTimer=70;foodTimer=45;shake=0;transitionTimer=0;anim=0;state='ready';start.textContent='Start Game';overlay.classList.remove('hidden','victory');updateHud()}
function startGame(){reset();state='playing';player.vy=flapVelocity;overlay.classList.add('hidden')}
function updateHud(){let stage=currentStage();scoreEl.textContent=score;stageEl.textContent=stage.label+' · '+stage.world.toUpperCase();foodEl.textContent=stage.food+' FOOD '+foodCount+' / '+stage.foodNeeded;powerEl.textContent=powerReady?stage.powerLabel+' READY':powerTimer>0?stage.powerLabel+' ACTIVE':'POWER: LOCKED';powerButton.textContent=powerReady?stage.powerLabel:'POWER';powerButton.classList.toggle('hidden',!powerReady||state!=='playing')}
function flap(){if(state==='ready'||state==='dead'){startGame()}else if(state==='playing'){player.vy=flapVelocity;burst(player.x-12,player.y+8,'#fff',3)}}
function addObstacle(){let stage=currentStage(),top=95+Math.random()*(stage.gap>160?255:270);obstacles.push({x:W+20,top,bottom:top+stage.gap,passed:false,alive:true})}
function addFood(){let stage=currentStage(),y=85+Math.random()*390;collectibles.push({x:W+45,y,phase:Math.random()*7,got:false})}
function hitRect(cx,cy,r,rx,ry,rw,rh){let x=Math.max(rx,Math.min(cx,rx+rw)),y=Math.max(ry,Math.min(cy,ry+rh));return (cx-x)**2+(cy-y)**2<r*r}
function burst(x,y,color,count=8){for(let i=0;i<count;i++)particles.push({x,y,vx:(Math.random()-.5)*4,vy:(Math.random()-.5)*4-1,life:28+Math.random()*20,color,size:2+Math.random()*4})}
function die(){if(state!=='playing')return;state='dead';title.textContent='💥 Flight Over';message.textContent='Score: '+score+'. Reach '+currentStage().checkpoint+' to evolve.';start.textContent='Try Again';overlay.classList.remove('hidden');powerButton.classList.add('hidden')}
function beginEvolution(){state='evolving';transitionTimer=0;player.vy=0;player.y=300;obstacles=[];collectibles=[];burst(player.x,player.y,'#fef08a',45);updateHud()}
function finishEvolution(){stageIndex++;foodCount=0;powerReady=false;powerTimer=0;fireballs=[];player={x:105,y:300,vy:0,r:17,rot:0};state='playing';spawnTimer=70;foodTimer=45;burst(player.x,player.y,'#fff',34);updateHud()}
function victory(){state='victory';transitionTimer=0;player.y=420;obstacles=[];collectibles=[];powerButton.classList.add('hidden');title.textContent='🌈 FINAL VICTORY!';message.innerHTML='You completed the evolution!<br>🐦 → 🦅 → 🐉 → 🦄<br><br>SCORE: '+score;start.textContent='Play Again';overlay.classList.add('hidden','victory')}
function activatePower(){if(!powerReady||state!=='playing')return;let power=currentStage().power;powerReady=false;if(power==='dash'){powerTimer=65}else if(power==='vision'){powerTimer=210}else if(power==='fire'){powerTimer=120;for(let i=0;i<3;i++)fireballs.push({x:player.x+35,y:player.y,vx:6+i*.8,life:80})}else if(power==='teleport'){let oldX=player.x,nextX=Math.min(260,player.x+105);while(nextX>player.x+20&&obstacles.some(p=>hitRect(nextX,player.y,player.r,p.x,0,pipeW,p.top)||hitRect(nextX,player.y,player.r,p.x,p.bottom,pipeW,ground-p.bottom)))nextX-=20;player.x=nextX;player.y=Math.max(90,Math.min(470,player.y+(Math.random()-.5)*100));burst(oldX,player.y,'#e879f9',24);burst(player.x,player.y,'#fde68a',30)}shake=8;updateHud()}
function update(dt){
 if(state==='playing'){
  let s=currentStage();player.vy+=gravity*dt;player.y+=player.vy*dt;player.rot=Math.max(-.55,Math.min(1.15,player.vy*.075));frame+=dt;spawnTimer+=dt;foodTimer+=dt;
  if(spawnTimer>=s.spawn){addObstacle();spawnTimer-=s.spawn}if(foodTimer>=105){addFood();foodTimer=0}
  if(powerTimer>0)powerTimer-=dt;
    for(const p of obstacles){p.x-=s.speed*dt;if(!p.passed&&p.x+pipeW<player.x){p.passed=true;score++;scoreEl.textContent=score;if(score>=s.checkpoint){if(stageIndex===STAGES.length-1)victory();else beginEvolution();return}}
     let safe=powerTimer>0&&s.power==='dash';if(!safe&&(hitRect(player.x,player.y,player.r,p.x,0,pipeW,p.top)||hitRect(player.x,player.y,player.r,p.x,p.bottom,pipeW,ground-p.bottom)))die()}
    for(const fireball of fireballs){fireball.x+=fireball.vx*dt;fireball.life-=dt;for(const p of obstacles){if(p.alive&&hitRect(fireball.x,fireball.y,10,p.x,0,pipeW,p.top)||p.alive&&hitRect(fireball.x,fireball.y,10,p.x,p.bottom,pipeW,ground-p.bottom)){p.alive=false;fireball.life=0;burst(fireball.x,fireball.y,'#fb923c',18);shake=5}}}fireballs=fireballs.filter(f=>f.life>0&&f.x<W+40);
  obstacles=obstacles.filter(p=>p.x>-pipeW&&p.alive);for(const item of collectibles){item.x-=s.speed*dt;item.phase+=.08*dt;if(!item.got&&Math.hypot(player.x-item.x,player.y-(item.y+Math.sin(item.phase)*9))<player.r+15){item.got=true;foodCount++;burst(item.x,item.y,'#fde68a',12);if(foodCount>=s.foodNeeded){powerReady=true;burst(player.x,player.y,'#fff',18)}updateHud()}}collectibles=collectibles.filter(i=>i.x>-30&&!i.got);
  if(player.y-player.r<0||player.y+player.r>ground)die();
 }else if(state==='evolving'){transitionTimer+=dt;player.y=300+Math.sin(transitionTimer*.2)*10;if(transitionTimer>100)finishEvolution()
 }else if(state==='victory'){transitionTimer+=dt;player.x=Math.min(350,player.x+1.8*dt);player.y=420+Math.sin(transitionTimer*.12)*20;if(transitionTimer>90)overlay.classList.add('victory')}
 for(const p of particles){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=.04*dt;p.life-=dt}particles=particles.filter(p=>p.life>0);shake=Math.max(0,shake-dt);updateHud()
}
function cloud(x,y,s,color='#fff8'){ctx.fillStyle=color;ctx.beginPath();ctx.arc(x,y,22*s,0,7);ctx.arc(x+25*s,y-8*s,28*s,0,7);ctx.arc(x+55*s,y,20*s,0,7);ctx.fill()}
function mountain(color,base,peak){ctx.fillStyle=color;ctx.beginPath();ctx.moveTo(0,ground);ctx.lineTo(base-160,base);ctx.lineTo(base-70,peak);ctx.lineTo(base+20,base);ctx.lineTo(W,ground);ctx.fill()}
function drawRainbow(){ctx.lineWidth=10;ctx.lineCap='round';['#ef4444','#f97316','#facc15','#22c55e','#3b82f6','#8b5cf6'].forEach((c,i)=>{ctx.strokeStyle=c;ctx.beginPath();ctx.arc(375,455,125-i*10,Math.PI,Math.PI*2);ctx.stroke()});ctx.lineWidth=1}
function background(){let w=currentStage().world,g=ctx.createLinearGradient(0,0,0,H);if(w==='city'){g.addColorStop(0,'#55b8e8');g.addColorStop(1,'#f5c88b')}if(w==='forest'){g.addColorStop(0,'#82d9ee');g.addColorStop(1,'#a8d878')}if(w==='mountains'){g.addColorStop(0,'#263c72');g.addColorStop(1,'#ec8063')}if(w==='heaven'){g.addColorStop(0,'#83d9ff');g.addColorStop(1,'#fff0ba')}ctx.fillStyle=g;ctx.fillRect(0,0,W,H);cloud(45,95,.75);cloud(310,145,.55);cloud(210,55,.42);
 if(w==='city'){ctx.fillStyle='#29435c99';for(let x=0;x<W;x+=58){let h=75+(x*17)%110;ctx.fillRect(x,ground-h,45,h);ctx.fillStyle='#fce38a99';for(let wy=ground-h+14;wy<ground-12;wy+=22)ctx.fillRect(x+10,wy,7,10);ctx.fillStyle='#29435c99'}}
 if(w==='forest'){ctx.fillStyle='#47734a';ctx.beginPath();ctx.moveTo(0,ground);ctx.lineTo(0,390);ctx.lineTo(90,335);ctx.lineTo(180,410);ctx.lineTo(285,350);ctx.lineTo(480,400);ctx.lineTo(480,ground);ctx.fill();for(let x=20;x<W;x+=75){ctx.fillStyle='#4a3024';ctx.fillRect(x,360,16,ground-360);ctx.fillStyle='#215c3b';ctx.beginPath();ctx.arc(x+8,345,42,0,7);ctx.fill()}}
 if(w==='mountains'){mountain('#37456b',430,190);mountain('#566b8d',470,240);mountain('#e8edf4',360,120);ctx.fillStyle='#b94735';ctx.fillRect(387,470,13,65);ctx.fillStyle='#ffbd54';ctx.fillRect(387,465,13,10)}
 if(w==='heaven'){ctx.fillStyle='#fff6';ctx.fillRect(0,200,W,120);cloud(25,340,1.2);cloud(315,290,1.1);drawRainbow()}
}
function drawObstacles(){let s=currentStage();for(const p of obstacles){ctx.globalAlpha=powerTimer>0&&s.power==='vision'?.7:1;ctx.fillStyle=s.world==='city'?'#475569':s.world==='forest'?'#68432d':s.world==='mountains'?'#64748b':'#fff';ctx.fillRect(p.x,0,pipeW,p.top);ctx.fillRect(p.x,p.bottom,pipeW,ground-p.bottom);ctx.fillStyle=s.world==='heaven'?'#dbeafe':s.world==='forest'?'#8b5a38':'#94a3b8';ctx.fillRect(p.x-5,p.top-15,pipeW+10,15);ctx.fillRect(p.x-5,p.bottom,pipeW+10,15);if(powerTimer>0&&s.power==='vision'){ctx.strokeStyle='#fde68a';ctx.lineWidth=3;ctx.strokeRect(p.x-8,0,pipeW+16,p.top);ctx.strokeRect(p.x-8,p.bottom,pipeW+16,ground-p.bottom)}}ctx.globalAlpha=1}
function drawCreature(){ctx.save();ctx.translate(player.x,player.y);ctx.rotate(player.rot);let n=currentStage().name,wing=Math.sin(frame*.22)*.25;ctx.shadowBlur=n==='horse'?18:0;ctx.shadowColor='#fde68a';if(n==='bird'){ctx.fillStyle='#f6c343';ctx.beginPath();ctx.arc(0,0,17,0,7);ctx.fill();ctx.fillStyle='#eaa72d';ctx.beginPath();ctx.ellipse(-9,7,15,7,-.2+wing,0,7);ctx.fill();ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(7,-6,6,0,7);ctx.fill();ctx.fillStyle='#111';ctx.beginPath();ctx.arc(9,-6,3,0,7);ctx.fill();ctx.fillStyle='#f08a35';ctx.beginPath();ctx.moveTo(15,0);ctx.lineTo(34,6);ctx.lineTo(15,10);ctx.fill()}else{let scale=n==='eagle'?1.45:n==='dragon'?1.5:1.35;ctx.scale(scale,scale);ctx.fillStyle=n==='eagle'?'#5b3a20':n==='dragon'?'#7c3aed':'#f8fafc';ctx.beginPath();ctx.ellipse(0,0,25,16,0,0,7);ctx.fill();ctx.fillStyle=n==='eagle'?'#7a4d27':n==='dragon'?'#a855f7':'#60a5fa';ctx.beginPath();ctx.ellipse(-9,4,25,9,-.35+wing,0,7);ctx.fill();ctx.fillStyle=n==='dragon'?'#c4b5fd':'#f8fafc';ctx.beginPath();ctx.arc(15,-10,13,0,7);ctx.fill();ctx.fillStyle=n==='dragon'?'#f97316':n==='eagle'?'#f2b544':'#f472b6';ctx.beginPath();ctx.moveTo(25,-8);ctx.lineTo(41,-2);ctx.lineTo(25,2);ctx.fill();ctx.fillStyle='#111';ctx.beginPath();ctx.arc(18,-13,3,0,7);ctx.fill();if(n==='dragon'){ctx.fillStyle='#fef08a';ctx.beginPath();ctx.moveTo(-8,-14);ctx.lineTo(-1,-28);ctx.lineTo(5,-13);ctx.fill()}else if(n==='horse'){ctx.fillStyle='#fbbf24';ctx.beginPath();ctx.moveTo(14,-20);ctx.lineTo(20,-43);ctx.lineTo(25,-18);ctx.fill()}}ctx.restore()}
function draw(){ctx.save();let sx=(Math.random()-.5)*shake;ctx.translate(sx,0);background();ctx.fillStyle='#74b94f';ctx.fillRect(0,ground,W,H-ground);drawObstacles();for(const i of collectibles){ctx.font='25px Georgia';ctx.textAlign='center';ctx.fillText(currentStage().food,i.x,i.y+Math.sin(i.phase)*9)}for(const fireball of fireballs){ctx.fillStyle='#fb923c';ctx.shadowBlur=14;ctx.shadowColor='#fef08a';ctx.beginPath();ctx.arc(fireball.x,fireball.y,9,0,7);ctx.fill();ctx.shadowBlur=0}for(const p of particles){ctx.globalAlpha=Math.max(0,p.life/40);ctx.fillStyle=p.fire?'#fb923c':p.color;ctx.beginPath();ctx.arc(p.x,p.y,p.size,0,7);ctx.fill()}ctx.globalAlpha=1;drawCreature();if(state==='evolving'){ctx.fillStyle='#ffffff55';ctx.fillRect(0,0,W,H);ctx.fillStyle='#fff';ctx.textAlign='center';ctx.font='900 30px Georgia';ctx.fillText('✨ EVOLUTION ✨',W/2,115);ctx.font='700 18px Georgia';ctx.fillText('The sky is changing...',W/2,145)}ctx.restore()}
function loop(t){let dt=Math.min(2.2,(t-last)/16.67||1);last=t;update(dt);draw();requestAnimationFrame(loop)}
start.onclick=startGame;powerButton.onclick=activatePower;canvas.addEventListener('pointerdown',e=>{e.preventDefault();flap()});window.addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();flap()}if(e.code==='KeyE'){e.preventDefault();activatePower()}});reset();requestAnimationFrame(loop);
</script>
</body>
</html>
